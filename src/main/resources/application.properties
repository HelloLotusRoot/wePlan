server.port=8080

# MySQL Database Config
spring.datasource.url=jdbc:mysql://localhost:3306/weplan?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
